<body class="hide-scrollbar crt secret body">
    
    <div style="text-align: center; padding: 1rem 0;">
        <input

            autocomplete="off"
            autofocus

        line-height: 1.8;

    "></div>

    <div class="center" style="padding-top: 20rem;"></div>

        function hexWithDashesToString(hexWithDashes) {
            const hex = hexWithDashes.replace(/-/g, '');
            let str = '';
            for (let i = 0; i < hex.length; i += 2) {
                str += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
            }
            return str;
        }

        const encryptedText = hexWithDashesToString(encryptedHex);

        function displayEncrypted() {
            const cipherEl = document.getElementById('cipherDisplay');
            let displayText = '';
            
            for (let i = 0; i < encryptedText.length; i++) {
                const charCode = encryptedText.charCodeAt(i);
                if (charCode < 32 || charCode > 126) {
                    displayText += '�';
                } else {
                    displayText += encryptedText.charAt(i);
                }
            }
            
            cipherEl.textContent = displayText;
        }

        function decryptWithPassword(password) {
            const decrypted = xorCrypt(encryptedText, password);
            const decryptedEl = document.getElementById('decryptedDisplay');
            const cipherEl = document.getElementById('cipherDisplay');

            cipherEl.style.display = 'none';
            decryptedEl.style.display = 'block';
            decryptedEl.textContent = decrypted;
            
            const readableChars = decrypted.match(/[a-zA-Z0-9 .,!?'"-]/g);
            const readability = readableChars ? readableChars.length / decrypted.length : 0;
            
            if (readability > 0.6) {
                decryptedEl.style.color = '#fff';
            } else {
                decryptedEl.style.color = '#666';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            displayEncrypted();
            document.getElementById('passwordInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const password = this.value.trim();
                    if (password) {
                        decryptWithPassword(password);
                    }
                }
            });
            
            document.getElementById('passwordInput').addEventListener('input', function() {
                const password = this.value.trim();
                if (password.length > 0) {
                    decryptWithPassword(password);
                } else {
                    document.getElementById('cipherDisplay').style.display = 'block';
                    document.getElementById('decryptedDisplay').style.display = 'none';
                }
            });
        });
