    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>BrunOS</title>
        <link rel="stylesheet" href="css/style.css"/>
        <link rel="stylesheet" href="css/clock.css"/>
        <link rel="stylesheet" href="css/shortcut.css"/>
        <link rel="stylesheet" href="css/window.css"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">

            as="font"
        />

    <body>
        <div id="background-text">BrunOS</div>
        <div id="computer" class="shortcut" style="left: 30px; top: 20px;">
            <img width="35" height="35" src="images/computer.png">
            <span>Home</span>
        </div>
        <div id="trash" class="shortcut" style="left: 85px; top: 20px;">
            <img width="35" height="35" src="images/trash.png">
            <span>Trash</span>
        </div>
        <div id="pingpong" class="shortcut" style="left: 135px; top: 20px;">
            <img width="35" height="35" src="images/pingpong.png">
            <span>Ping Pong</span>
        </div>
        <div id="clock" class="shortcut" style="left: 200px; top: 20px;">
            <img width="35" height="35" src="images/clock.png">
            <span>Clock</span>
        </div>
        <script src="main.js" type="module"></script>
