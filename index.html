<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holy Moly</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>

<main class="canvas" id="canvas">
  <svg id="connections"></svg>

  <div class="node node--text node--darkmode" id="n-darkmode"
      style="left:35px; top:80px;">
    <div class="card">
      <div class="card__icon"></div>
    </div>
  </div>

  <div class="node node--text node--bgpicker" id="n-bgpicker"
      style="left:70px; top:80px;">
    <div class="card">
      <div class="card__icon">🖼️</div>
    </div>
  </div>
  <input type="file" id="bgFileInput" accept="image/*">

  <div class="node node--text node--bgclear" id="n-clear-bg"
      style="left:105px; top:80px;">
    <div class="card">
      <div class="card__icon">❌</div>
    </div>
  </div>

  <div class="node node--text" id="n-welcome"
      style="left:40px; top:30px;">
    <div class="card">
      <div class="card__label">Holy Moly</div>
      <div class="card__body">
        nichtbruno · <a href="https://creativecommons.org/licenses/by-sa/4.0/">© 2026</a>
      </div>
    </div>
  </div>

  <!-- Image -->
  <div class="node node--image" id="n-img1"
       style="left:40px; top:130px; width:160px; height:110px;">
    <div class="tooltip">Under Construction</div>
    <div class="card" style="height:100%;">
      <img src="assets/images/workinprogress.png"
           alt="Retro arcade machines"
           onerror="this.parentElement.parentElement.style.display='none'">
    </div>
  </div>

  <div class="node lavender node--disabled" id="n-arcade1"
       style="left:260px; top:140px;"
       data-page="retro-arcade/index.html">
    <div class="tooltip">Oh no, hide your cows!</div>
    <div class="card">
      <div class="card__header">
        <div>
          <p class="card__title">Alien Invaders 🔫</p>
          <div class="card__icons" style="margin-top:4px">pew pew</div>
        </div>
        <img src="assets/images/timer.png" alt="custom icon">
      </div>
    </div>
  </div>

  <div class="node sky" id="n-arcade2"
       style="left:520px; top:260px;"
       data-page="jumpnrun/index.html">
    <div class="tooltip">67</div>
    <div class="card">
      <div class="card__header">
        <div>
          <p class="card__title">Holy Runner</p>
          <div class="card__icons" style="margin-top:4px">. . . .</div>
        </div>
        <img src="assets/images/jumpnrun.png" alt="custom icon">
      </div>
    </div>
  </div>
</main>

<div class="page-backdrop" id="backdrop"></div>
<button class="page-close"  id="closeBtn">✕</button>
<div class="page-overlay"   id="pageOverlay">
  <div class="page-inner"   id="pageInner">
    <!-- <iframe class="page-frame" id="pageFrame"
            src="about:blank"
            sandbox="allow-scripts allow-same-origin allow-forms"></iframe> -->
  </div>
</div>

<script type="module">
  import { drawConnections } from './js/connections.js';
  import { initOverlay }     from './js/overlay.js';

  const PAIRS = [
    ['n-arcade1', 'n-arcade2'],
    ['n-arcade1', 'n-img1'],
  ];

  function redraw() { drawConnections(PAIRS); }

  // Expose so overlay.js drag handler can call it
  window.__redrawConnections = redraw;

  window.addEventListener('load',   () => setTimeout(redraw, 120));
  window.addEventListener('resize', redraw);

  initOverlay();
</script>
</body>
</html>
