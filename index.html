<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>BrunOS</title>
        <link rel="stylesheet" href="css/style.css"/>
        <link rel="stylesheet" href="css/clock.css"/>
        <link rel="stylesheet" href="css/countdown.css"/>
        <link rel="stylesheet" href="css/gallery.css"/>
        <link rel="stylesheet" href="css/about.css"/>
        <link rel="stylesheet" href="css/timer.css"/>
        <link rel="stylesheet" href="css/shortcut.css"/>
        <link rel="stylesheet" href="css/window.css"/>
        <link
            rel="preload"
            href="/fonts/AnonymousPro-Regular.ttf"
            as="font"
        />
        <link rel="icon" type="gif" href="/images/sigma.gif">
    </head>
    <body>
        <div id="background-text">BrunOS🗿</div>
        <!-- system -->
        <div id="computer" class="shortcut" style="left: 25px; top: 20px;">
            <img src="images/about.png">
            <span>About</span>
        </div>
        <div id="gallery" class="shortcut" style="left: 100px; top: 20px;">
            <img src="images/gallery.png">
            <span>Gallery</span>
        </div>
        <div id="cc" class="shortcut" style="left: 170px; top: 20px;">
            <img src="images/cc.png">
            <span>LICENSE</span>
        </div>
        <!-- apps -->
        <div id="countdown" class="shortcut" style="left: 20px; top: 100px;">
            <img src="images/hourglass.gif">
            <span>Countdown</span>
        </div>
        <div id="clock" class="shortcut" style="left: 100px; top: 100px;">
            <img src="images/clock.png">
            <span>Clock</span>
        </div>
        <div id="timer" class="shortcut" style="left: 170px; top: 100px;">
            <img src="images/timer.png">
            <span>Timer</span>
        </div>
        <!-- ai -->
        <div id="chatgpt" class="shortcut" style="left: 25px; top: 180px;">
            <img src="images/chatgpt.png">
            <span>ChatGPT</span>
        </div>
        <div id="deepseek" class="shortcut" style="left: 95px; top: 180px;">
            <img src="images/deepseek.png">
            <span>Deepseek</span>
        </div>
        <div id="claude" class="shortcut" style="left: 170px; top: 180px;">
            <img src="images/claude.png">
            <span>ClaudeAI</span>
        </div>
        <div id="perplexity" class="shortcut" style="left: 240px; top: 180px;">
            <img src="images/perplexity.png">
            <span>Perplexity</span>
        </div>
        <!-- links -->
        <div id="google" class="shortcut" style="left: 25px; top: 265px;">
            <img src="images/google.png">
            <span>Google</span>
        </div>
        <div id="github" class="shortcut" style="left: 95px; top: 265px;">
            <img src="images/github.png">
            <span>GitHub</span>
        </div>
        <!-- games -->
        <div id="pingpong" class="shortcut" style="left: 20px; top: 345px;">
            <img src="images/pingpong.png">
            <span>Ping Pong</span>
        </div>
        <script src="main.js" type="module"></script>
    </body>
</html>
