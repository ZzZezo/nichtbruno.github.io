<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holy Moly</title>
  <link rel="icon" type="image/x-icon" href="assets/images/holy-moly.ico">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <script src="js/perf.js"></script>
</head>
<body>

<main class="canvas" id="canvas">
  <div class="toolbar-item" id="btn-darkmode">
    <div class="tooltip tooltip--down">Toggle dark mode</div>
    ☀️
  </div>
  <div class="toolbar-item" id="btn-bgpicker">
    <div class="tooltip tooltip--down">Set background</div>
    🖼️
  </div>
  <div class="toolbar-item" id="btn-bgclear">
    <div class="tooltip tooltip--down">Clear background</div>
    ❌
  </div>
  <input type="file" id="bgFileInput" accept="image/*">
  <div id="star-placeholder"></div>

  <div class="site-label" id="site-label">
    <div class="tooltip tooltip--down">Almost all of the UI is made by ClaudeAI</div>
    Holy Moly · nichtbruno
  </div>

  <!-- Big -->
  <div class="node node--big node--sky" id="n-arcade2"
       data-page="jumpnrun/index.html">
    <div class="tooltip">Press Space to jump</div>
    <div class="node__icon">
      <img src="assets/images/jumpnrun.png" alt="Holy Runner"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
    </div>
    <span class="node__label">Holy Jump</span>
  </div>

  <div class="node node--big node--yellow" id="n-arcade1" data-page="luckgame/index.html">
    <div class="tooltip">777</div>
    <div class="node__icon">
      <img src="assets/images/goldcoin.png" alt="Luck Game"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
    </div>
    <span class="node__label">Luck Game</span>
  </div>

  <!-- Medium -->
  <div class="node node--medium node--lavender" id="n-arcade3"
       data-page="clock/index.html">
    <div class="tooltip">Tik Tak</div>
    <div class="node__icon">
      <img src="assets/images/clock.png" alt="Clock"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
    </div>
    <span class="node__label">Clock</span>
  </div>

  <div class="node node--medium node--green" id="n-arcade4"
       data-page="timer/index.html">
    <div class="tooltip">. . .</div>
    <div class="node__icon">
      <img src="assets/images/countdown.png" alt="Timer"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
    </div>
    <span class="node__label">Timer</span>
  </div>

  <!-- Small -->
  <div class="node node--small" id="n-arcade5">
    <div class="tooltip">Yea there is nothing here</div>
    <div class="node__icon">
      <img src="assets/images/infoicon.png" alt="WIP"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
    </div>
    <span class="node__label">Info</span>
  </div>

  <div class="node node--small" id="n-arcade6" data-page="https://github.com/nichtbruno">
    <div class="tooltip">Github</div>
    <div class="node__icon">
      <img src="assets/images/github.png" alt="WIP"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
    </div>
    <span class="node__label">Repo</span>
  </div>

  <div class="node node--small" id="n-arcade7" data-page="https://iwannajumpoffacliff.com/">
    <div class="tooltip">#ad</div>
    <div class="node__icon">
      <img src="assets/images/holy-moly.gif" alt="WIP"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
    </div>
    <span class="node__label">???</span>
  </div>

  <div class="node node--small" id="n-arcade8" data-page="https://www.chess.com">
    <div class="tooltip">Get Big Brain</div>
    <div class="node__icon">
      <img src="assets/images/chess-icon.png" alt="WIP"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
    </div>
    <span class="node__label">Chess.com</span>
  </div>
</main>

<script type="module">
  import { initOverlay } from './js/overlay.js';

  document.getElementById('btn-darkmode').addEventListener('click', function() {
    if (this._wasDragged) return;
    const on = !document.documentElement.classList.contains('dark');
    document.documentElement.classList.toggle('dark', on);
    localStorage.setItem('darkMode', on ? '1' : '0');
    this.lastChild.textContent = on ? '\n  🌙\n' : '\n  ☀️\n';
  });

  if (localStorage.getItem('darkMode') === '1') {
    const btn = document.getElementById('btn-darkmode');
    btn.lastChild.textContent = '\n  🌙\n';
  }

  document.getElementById('btn-bgpicker').addEventListener('click', function() {
    if (this._wasDragged) return;
    document.getElementById('bgFileInput').click();
  });

  document.getElementById('btn-bgclear').addEventListener('click', function() {
    if (this._wasDragged) return;
    const cvs = document.getElementById('canvas');
    if (cvs) cvs.style.backgroundImage = '';
    try {
      const r = indexedDB.open('holymoly', 1);
      r.onsuccess = e => {
        const db = e.target.result;
        const tx = db.transaction('settings', 'readwrite');
        tx.objectStore('settings').delete('bgImage');
      };
    } catch(e) {}
  });

  initOverlay();
</script>
<script>
  if (Math.random() < 0.000001) {
    document.getElementById('star-placeholder').innerHTML = `
      <div class="toolbar-item" id="star">
        <div class="tooltip tooltip--down">Yooo! There is only 1 in 1.000.000 chance of this star appearing 🎉</div>
        ⭐
      </div>
    `;
  }
</script>
</body>
</html>
