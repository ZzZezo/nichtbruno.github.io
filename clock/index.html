<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock · Holy Moly</title>
  <style>
    @font-face {
      font-family: 'WIN';
      src: url('../../assets/fonts/Windows Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--color-bg);
    }

    /* ── Back button ── */
    .back-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px 7px 10px;
      background: rgba(20, 20, 20, 0.55);
      border: 1.5px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      text-decoration: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background 0.2s, transform 0.15s;
      letter-spacing: 0.05em;
      cursor: pointer;
      outline: none;
    }
    .back-btn:hover {
      background: rgba(40, 40, 40, 0.80);
      transform: translateX(-2px);
    }
    .back-btn::before {
      content: '←';
      font-size: 15px;
    }

    /* ── Your CSS, untouched ── */
    :root {
      --color-green: #A6F999;
      --color-blue: #C0C6FC;
      --color-secondary: #99f2f9;
      --color-red: #F99999;
      --color-bg: #030303;
      --color-fg-low-contrast: #DFDFDF;
      --color-fg-high-contrast: #ffffff;
      --color-fg-dimed: #B8B5BE;
      --color-border-hint: #1E2121;
      --color-selection: var(--color-bg);
      --color-cool: #08080b;
    }
    .digital-clock {
      display: flex;
      justify-content: center;
      align-content: center;
      color: var(--color-fg-dimed);
      font-family: "WIN";
      margin-bottom: 5px;
      user-select: none;
    }
    .clock-container {
      display: flex;
      justify-content: center;
      align-content: center;
      font-family: "WIN";
      pointer-events: none;
      overflow: hidden;
      user-select: none;
      font-size: 16px;
    }
    .clock-box {
      position: relative;
      width: 400px;
      height: 400px;
      border-style: double;
      border-width: 5px;
      border-color: var(--color-fg-dimed);
      background-color: var(--color-bg);
    }
    .handle-item {
      color: var(--color-fg-high-contrast);
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: center center;
      text-align: center;
    }
    .handle {
      position: absolute;
      width: 100%;
      height: 100%;
    }
    .hour-item {
      color: var(--color-red);
    }
    .minute-item {
      color: var(--color-green);
    }
    .seconds-item {
      color: var(--color-secondary);
    }
  </style>
</head>
<body>

  <button class="back-btn" id="back-btn" onclick="history.back()">Home</button>

  <div id="clock-wrapper"></div>

  <script type="module">
    import { createClock } from './js/main.js';

    function loadBg() {
      return new Promise((res) => {
        const r = indexedDB.open('holymoly', 1);
        r.onupgradeneeded = e => e.target.result.createObjectStore('settings');
        r.onsuccess = e => {
          const tx = e.target.result.transaction('settings', 'readonly');
          const req = tx.objectStore('settings').get('bgImage');
          req.onsuccess = ev => res(ev.target.result ?? null);
          req.onerror   = () => res(null);
        };
        r.onerror = () => res(null);
      });
    }

    window.addEventListener('load', async () => {
      const blob = await loadBg();
      if (blob) {
        const url = URL.createObjectURL(blob);
        Object.assign(document.body.style, {
          backgroundImage:    `url(${url})`,
          backgroundSize:     'cover',
          backgroundPosition: 'center',
        });
      }
      document.getElementById('clock-wrapper').appendChild(createClock());
    });
  </script>  <script>
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') history.back();
    });
  </script>
</body>
</html>
