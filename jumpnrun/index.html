<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holy Jump</title>
  <style>
    @font-face {
      font-family: 'Windows';
      src: url('../../assets/fonts/Windows Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    body {
      margin: 0;
      padding: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Windows', monospace;
    }

    .back-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px 7px 10px;
      background: rgba(20, 20, 20, 0.55);
      border: 1.5px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      color: #fff;
      font-family: 'Windows', monospace;
      font-size: 13px;
      text-decoration: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background 0.2s, transform 0.15s;
      letter-spacing: 0.05em;
      cursor: pointer;
      outline: none;
    }
    .back-btn:hover {
      background: rgba(40, 40, 40, 0.80);
      transform: translateX(-2px);
    }
    .back-btn::before {
      content: '←';
      font-size: 15px;
    }

    #game-wrapper {
      width: 800px;
      height: 500px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <button class="back-btn" id="back-btn" onclick="history.back()">Home</button>

  <div id="game-wrapper"></div>
  <script>
    (function loadBg() {
      const r = indexedDB.open('holymoly', 1);
      r.onupgradeneeded = e => e.target.result.createObjectStore('settings');
      r.onsuccess = e => {
        const tx = e.target.result.transaction('settings', 'readonly');
        const req = tx.objectStore('settings').get('bgImage');
        req.onsuccess = ev => {
          const blob = ev.target.result;
          if (blob) {
            const url = URL.createObjectURL(blob);
            Object.assign(document.body.style, {
              backgroundImage:    `url(${url})`,
              backgroundSize:     'cover',
              backgroundPosition: 'center',
            });
          }
        };
      };
    })();
  </script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') history.back();
    });
  </script>
  <script src="../assets/js/perf_badge.js"></script>
</body>
</html>
